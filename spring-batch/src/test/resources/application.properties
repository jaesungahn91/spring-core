spring.application.name=spring-batch

spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

batch.user-import.input-file=classpath:data/users.csv
batch.user-import.cron=0 0 2 * * ?

batch.cleanup.target-directory=/tmp/batch-cleanup
batch.cleanup.retention-days=7
batch.cleanup.cron=0 0 3 * * ?

batch.user-api-import.cron=0 0 4 * * ?

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
# 테스트 중 Quartz 스케줄러 자동 시작 방지
spring.quartz.auto-startup=false
spring.main.allow-bean-definition-overriding=true
