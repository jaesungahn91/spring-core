name: 버그 리포트
description: 버그를 발견하셨나요? 자세히 알려주세요.
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 영향받는 모듈
      description: 어떤 모듈에서 버그가 발생했나요?
      options:
        - spring-security-jwt
        - spring-data-jpa
        - spring-rest-docs
        - spring-data-mongodb
        - spring-batch
        - 공통/기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 발견한 버그를 간단히 설명해주세요.
      placeholder: 예) 유저 생성 시 이메일 중복 검증이 동작하지 않습니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 단계를 작성해주세요.
      placeholder: |
        1. `/users` POST 요청으로 유저 생성
        2. 동일한 이메일로 다시 POST 요청
        3. 예상: 409 Conflict 응답
        4. 실제: 201 Created 응답
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로는 어떻게 동작하나요?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: Java 버전, Spring Boot 버전 등
      placeholder: |
        - Spring Boot: 2.7.6
        - Java: 11
        - OS: macOS 14.1
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 스택 트레이스, 로그, 스크린샷 등
    validations:
      required: false