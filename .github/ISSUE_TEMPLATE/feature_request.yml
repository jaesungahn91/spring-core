name: 기능 제안
description: 새로운 기능을 제안해주세요.
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 대상 모듈
      description: 어떤 모듈에 기능을 추가하시겠습니까?
      options:
        - spring-security-jwt
        - spring-data-jpa
        - spring-rest-docs
        - spring-data-mongodb
        - spring-batch
        - 신규 모듈
        - 공통/기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 문제 또는 필요성
      description: 이 기능이 왜 필요한가요? 어떤 문제를 해결하나요?
      placeholder: 예) JWT 토큰 갱신 기능이 없어서 사용자가 자주 재로그인해야 합니다.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      description: 어떻게 구현하면 좋을까요?
      placeholder: |
        - Refresh Token 도입
        - `/auth/refresh` 엔드포인트 추가
        - Access Token 만료 시 자동 갱신 로직
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 고려한 다른 방법이 있나요?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 레퍼런스, 다이어그램, 예제 코드 등
    validations:
      required: false