name: CI - Test

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

jobs:
  test-matrix:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - spring-security-jwt
          - spring-data-jpa
          - spring-rest-docs
          - spring-data-mongodb
          - spring-batch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK for ${{ matrix.module }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{
            (matrix.module == 'spring-data-mongodb' || matrix.module == 'spring-batch')
            && '17' || '11'
          }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ${{ matrix.module }}/gradlew

      - name: Run tests for ${{ matrix.module }}
        run: |
          cd ${{ matrix.module }}
          ./gradlew test --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/test/
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          cd ${{ matrix.module }}
          if [ -d build/test-results/test ]; then
            echo "### Test Results for ${{ matrix.module }}" >> $GITHUB_STEP_SUMMARY
            echo "Tests completed. See artifacts for detailed report." >> $GITHUB_STEP_SUMMARY
          fi